name: luxor-backend-keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Replit backend (direct)
        run: curl -sS -m 30 -o /dev/null -w "replit:%{http_code}\n" https://nice-useful-plot--al-bosify.replit.app/ping || true
      - name: Wake backend via Vercel proxy
        run: curl -sS -m 30 -o /dev/null -w "vercel:%{http_code}\n" https://www.luxor.ly/api/health || true
